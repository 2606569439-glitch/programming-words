            background: #fff7e6;

        const STORAGE_KEY = 'programmingWordsProgress';
        let currentIndex = 0;
        let shuffled = false;

        function loadProgress() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved !== null) {
                const savedIndex = parseInt(saved, 10);
                if (savedIndex >= 0 && savedIndex < words.length) {
                    currentIndex = savedIndex;
                    const notice = document.getElementById('resumeNotice');
                    document.getElementById('resumeNum').textContent = currentIndex + 1;
                    notice.style.display = 'block';
                    setTimeout(() => { notice.style.display = 'none'; }, 3000);
                }
            }
        }

        function saveProgress() {
            localStorage.setItem(STORAGE_KEY, currentIndex.toString());
        }

        function resetProgress() {
            if (confirm('确定要从头开始吗？当前进度将被清除。')) {
                localStorage.removeItem(STORAGE_KEY);
                currentIndex = 0;
                shuffled = false;
                document.getElementById('shuffleInfo').textContent = '按顺序学习';
                updateCard();
                document.getElementById('resumeNotice').style.display = 'none';
            }
        }

        function renderPhonics(w) {
            const box = document.getElementById('phonics');
            box.innerHTML = '';
            const ph = w.phonics || {syllables: [], stress: -1};
            const sylls = ph.syllables || [];
            if (sylls.length === 0) {
                box.style.display = 'none';
                return;
            }
            box.style.display = 'flex';
            sylls.forEach((syl, i) => {
                const div = document.createElement('div');
                div.className = 'syll' + (i === ph.stress ? ' stressed' : '');
                // 字母（大字）
                const l = document.createElement('div');
                l.className = 'syll-letters';
                l.textContent = syl.letters;
                div.appendChild(l);
                // 字母↔音标对照（小字）
                const p = document.createElement('div');
                p.className = 'syll-parts';
                (syl.parts || []).forEach((pair) => {
                    const letter = pair[0] || '';
                    const ipa = pair[1] || '';
                    const span = document.createElement('span');
                    span.className = 'part' + (ipa === '' ? ' silent' : '');
                    span.textContent = letter + '→' + (ipa || '∅');
                    p.appendChild(span);
                });
                div.appendChild(p);
                div.onclick = () => speakSyllable(syl.letters);
                box.appendChild(div);
            });
        }

        function renderStory(w) {
            const box = document.getElementById('storyBox');
            const s = w.story || {homophone: '', story: ''};
            if (!s.story) {
                box.style.display = 'none';
                return;
            }
            box.style.display = 'block';
            const hp = document.getElementById('homophone');
            if (s.homophone) {
                hp.style.display = 'block';
                hp.textContent = '🔊 谐音：' + s.homophone;
            } else {
                hp.style.display = 'none';
            }
            document.getElementById('storyText').textContent = s.story;
        }

        function updateCard() {
            const w = words[currentIndex];
            document.getElementById('word').textContent = w.word;
            document.getElementById('meaning').textContent = w.meaning || '（暂无释义）';
            document.getElementById('phonetic').textContent = w.phonetic ? '/' + w.phonetic + '/' : '';
            renderPhonics(w);
            renderStory(w);
            const exEl = document.getElementById('example');
            if (w.example) {
                exEl.textContent = w.example;
                exEl.style.display = 'block';
            } else {
                exEl.style.display = 'none';
            }
            document.getElementById('progress').textContent = (currentIndex + 1) + ' / ' + words.length;
            saveProgress();
        }

        function nextCard() {
            if (currentIndex < words.length - 1) {
                currentIndex++;
                updateCard();
            } else {
                alert('🎉 恭喜！你已经学完所有单词！\n\n点"打乱顺序"再来一轮，或者点"从头开始"重新学习！');
                currentIndex = 0;
                updateCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function shuffleCards() {
            shuffled = !shuffled;
            if (shuffled) {
                for (let i = words.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [words[i], words[j]] = [words[j], words[i]];
                }
                document.getElementById('shuffleInfo').textContent = '🔀 已打乱顺序';
            } else {
                location.reload();
            }
            currentIndex = 0;
            updateCard();
        }

        function speak() {
            const w = words[currentIndex];
            const word = w.word;
            // 词组（含空格）：有道读不了，改用浏览器 TTS
            if (word.indexOf(' ') !== -1) {
                tts(word);
                return;
            }
            // 单词：优先有道 dictvoice（真人音）
            const audio = new Audio(w.audio || ('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=1'));
            audio.play().catch(() => tts(word));
        }

        function speakSyllable(text) {
            // 点击音节：读该音节的字母组合（近似发音）
            tts(text, 0.7);
        }

        function tts(text, rate) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-US';
                u.rate = rate || 0.8;
                speechSynthesis.speak(u);
            }
        }

        loadProgress();
        updateCard();
    </script>
</body>
</html>
