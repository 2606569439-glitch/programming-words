<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编程单词卡 - 3 词</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 20px; }
        .header h1 { font-size: 24px; margin-bottom: 10px; }
        .progress { font-size: 14px; opacity: 0.9; }
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            text-align: center;
        }
        .word { font-size: 44px; font-weight: bold; color: #667eea; margin-bottom: 6px; word-break: break-all; }
        .phonetic { font-size: 17px; color: #888; margin-bottom: 12px; }
        .speaker {
            display: inline-block;
            font-size: 26px;
            cursor: pointer;
            padding: 12px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            width: 58px;
            height: 58px;
            line-height: 34px;
            margin-bottom: 18px;
        }
        .speaker:active { transform: scale(0.95); }
        .meaning {
            font-size: 21px;
            color: #333;
            margin-bottom: 18px;
            font-weight: bold;
            padding: 14px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 10px;
        }
        .example {
            font-size: 15px;
            color: #666;
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: left;
            font-family: "SF Mono", Consolas, monospace;
        }
        .category {
            font-size: 13px;
            color: #888;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 14px; }
        .btn {
            padding: 12px 22px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: white; color: #667eea; }
        .btn-secondary { background: rgba(255,255,255,0.3); color: white; }
        .btn:active { transform: scale(0.95); }
        .shuffle-info { text-align: center; color: white; font-size: 12px; opacity: 0.8; }
        .audio-hint { text-align: center; color: white; font-size: 12px; opacity: 0.7; margin-top: 10px; }
        .resume-notice {
            background: rgba(255,255,255,0.2);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐎 编程单词卡</h1>
            <div class="progress" id="progress">1 / 3</div>
        </div>

        <div class="resume-notice" id="resumeNotice" style="display: none;">
            💡 已从上次的位置继续（第 <span id="resumeNum"></span> 个单词）
        </div>

        <div class="card">
            <div class="word" id="word">loading…</div>
            <div class="phonetic" id="phonetic"></div>
            <div class="speaker" onclick="speak()">🔊</div>
            <div class="meaning" id="meaning"></div>
            <div class="example" id="example"></div>
            <div class="category" id="category"></div>
        </div>

        <div class="controls">
            <button class="btn btn-secondary" onclick="prevCard()">← 上一个</button>
            <button class="btn btn-primary" onclick="nextCard()">下一个 →</button>
        </div>
        <div class="controls">
            <button class="btn btn-secondary" onclick="shuffleCards()">🔀 打乱顺序</button>
            <button class="btn btn-secondary" onclick="resetProgress()">🔄 从头开始</button>
        </div>
        <div class="shuffle-info" id="shuffleInfo">按顺序学习</div>
        <div class="audio-hint">💡 点喇叭听发音（需要联网）</div>
    </div>

    <script>
        const words = [
        {
                "word": "terminal",
                "meaning": "终端机；终点的；终端",
                "example": "",
                "category": "编程/计算机",
                "phonetic": "ˈtəːmɪnəl",
                "audio": "https://dict.youdao.com/dictvoice?audio=terminal&type=1"
        },
        {
                "word": "sequence",
                "meaning": "序列；按顺序排好；顺序",
                "example": "",
                "category": "编程/计算机",
                "phonetic": "ˈsiːkwəns",
                "audio": "https://dict.youdao.com/dictvoice?audio=sequence&type=1"
        },
        {
                "word": "repository",
                "meaning": "贮藏所；仓库",
                "example": "",
                "category": "经济/商业",
                "phonetic": "rɪˈpɔzɪtərɪ",
                "audio": "https://dict.youdao.com/dictvoice?audio=repository&type=1"
        }
];

        const STORAGE_KEY = 'programmingWordsProgress';
        let currentIndex = 0;
        let shuffled = false;

        function loadProgress() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved !== null) {
                const savedIndex = parseInt(saved, 10);
                if (savedIndex >= 0 && savedIndex < words.length) {
                    currentIndex = savedIndex;
                    const notice = document.getElementById('resumeNotice');
                    document.getElementById('resumeNum').textContent = currentIndex + 1;
                    notice.style.display = 'block';
                    setTimeout(() => { notice.style.display = 'none'; }, 3000);
                }
            }
        }

        function saveProgress() {
            localStorage.setItem(STORAGE_KEY, currentIndex.toString());
        }

        function resetProgress() {
            if (confirm('确定要从头开始吗？当前进度将被清除。')) {
                localStorage.removeItem(STORAGE_KEY);
                currentIndex = 0;
                shuffled = false;
                document.getElementById('shuffleInfo').textContent = '按顺序学习';
                updateCard();
                document.getElementById('resumeNotice').style.display = 'none';
            }
        }

        function updateCard() {
            const w = words[currentIndex];
            document.getElementById('word').textContent = w.word;
            document.getElementById('meaning').textContent = w.meaning || '（暂无释义）';
            document.getElementById('phonetic').textContent = w.phonetic ? '/' + w.phonetic + '/' : '';
            document.getElementById('category').textContent = w.category || '';
            const exEl = document.getElementById('example');
            if (w.example) {
                exEl.textContent = w.example;
                exEl.style.display = 'block';
            } else {
                exEl.style.display = 'none';
            }
            document.getElementById('progress').textContent = (currentIndex + 1) + ' / ' + words.length;
            saveProgress();
        }

        function nextCard() {
            if (currentIndex < words.length - 1) {
                currentIndex++;
                updateCard();
            } else {
                alert('🎉 恭喜！你已经学完所有单词！\n\n点"打乱顺序"再来一轮，或者点"从头开始"重新学习！');
                currentIndex = 0;
                updateCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function shuffleCards() {
            shuffled = !shuffled;
            if (shuffled) {
                for (let i = words.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [words[i], words[j]] = [words[j], words[i]];
                }
                document.getElementById('shuffleInfo').textContent = '🔀 已打乱顺序';
            } else {
                location.reload();
            }
            currentIndex = 0;
            updateCard();
        }

        function speak() {
            const w = words[currentIndex];
            const word = w.word;
            // 词组（含空格）：有道读不了，改用浏览器 TTS
            if (word.indexOf(' ') !== -1) {
                if ('speechSynthesis' in window) {
                    const u = new SpeechSynthesisUtterance(word);
                    u.lang = 'en-US';
                    u.rate = 0.8;
                    speechSynthesis.speak(u);
                }
                return;
            }
            // 单词：优先有道 dictvoice（真人音）
            const audio = new Audio(w.audio || ('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=1'));
            audio.play().catch(() => {
                if ('speechSynthesis' in window) {
                    const u = new SpeechSynthesisUtterance(word);
                    u.lang = 'en-US';
                    u.rate = 0.8;
                    speechSynthesis.speak(u);
                }
            });
        }

        loadProgress();
        updateCard();
    </script>
</body>
</html>
